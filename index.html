<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HAPPY BIRTHDAY!!!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');
  html,body{height:100%;margin:0;}
  body{
    background: linear-gradient(135deg,#ff8da1 0%, #ffd86b 35%, #8ef6ff 100%);
    font-family: "Comic Neue", "Comic Sans MS", "Marker Felt", sans-serif;
    overflow:hidden;
    color:#000;
    text-align:center;
  }
  .header { position:relative; z-index:5; padding-top:40px; text-shadow: 4px 4px 0 rgba(255,255,255,0.8), -4px -4px 0 rgba(0,0,0,0.2); }
  h1{ font-size:6.5rem; margin:0; letter-spacing:6px; transform: rotate(-6deg); display:inline-block; padding:10px 20px; background: repeating-linear-gradient(45deg, rgba(255,255,255,0.15) 0 10px, rgba(255,255,255,0.05) 10px 20px); border:6px dashed #ff007f; border-radius:16px; }
  .blink { animation: blink 1s linear infinite; display:inline-block; margin-left:10px; }
  @keyframes blink { 0%{opacity:1; transform:scale(1);} 50%{opacity:0.25; transform:scale(1.08);} 100%{opacity:1; transform:scale(1);} }
  .controls { margin-top:18px; z-index:6; position:relative; }
  button { font-size:1rem; padding:10px 14px; margin:6px; border-radius:12px; border:3px groove #fff; cursor:pointer; box-shadow: 3px 3px 0 rgba(0,0,0,0.2); background:linear-gradient(#fff,#ffe6f0); font-weight:700; }
  #qrWrap { margin-top:14px; z-index:6; position:relative; }
  #qrImage { border:6px double #ff00aa; background:#fff; padding:6px;}
  #fwCanvas{ position:fixed; inset:0; z-index:1; pointer-events:none; }
  .star { position:fixed; width:40px;height:40px; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,0,0.5) 35%, rgba(255,0,255,0.15) 60%); border-radius:50%; box-shadow:0 0 24px rgba(255,255,0,0.5), inset 0 0 10px rgba(255,255,255,0.6); transform:rotate(15deg); animation: floaty 4s linear infinite; z-index:3; opacity:0.9; }
  @keyframes floaty { 0%{transform: translateY(0) rotate(0deg) scale(1);} 50%{transform: translateY(-30px) rotate(45deg) scale(1.05);} 100%{transform: translateY(0) rotate(0deg) scale(1);} }
  .marquee { position:fixed; bottom:0; width:100%; z-index:7; background: linear-gradient(90deg, rgba(0,0,0,0.05), rgba(255,255,255,0.15)); padding:6px 0; }
  .marquee p{ display:inline-block; white-space:nowrap; animation: slide 12s linear infinite; font-weight:900; font-size:1.1rem; }
  @keyframes slide{ 0%{transform:translateX(100%)} 100%{transform:translateX(-120%)} }
  @media (max-width:600px){ h1{font-size:3.2rem; padding:8px;} .star{width:26px;height:26px;} }
</style>
</head>
<body>
  <canvas id="fwCanvas"></canvas>

  <div class="header">
    <h1 id="hb">HAPPY BIRTHDAY</h1>
    <span class="blink">🎉</span>
  </div>

  <div class="controls">
    <button id="playBtn">▶ Play Sound (cheesy)</button>
    <!-- Start/Stop werden ausgeblendet, weil das Feuerwerk automatisch und permanent laufen soll -->
    <button id="startBtn">✨ Start Fireworks</button>
    <button id="stopBtn">🛑 Stop Fireworks</button>
    <button id="fullBtn">🔍 Vollbild (für extra Trash)</button>
  </div>

  <div id="qrWrap">
    <input id="urlInput" style="width:60%;padding:8px;border-radius:8px;border:2px solid #000;margin-top:10px" value="" placeholder="Hier URL einfügen (oder leer lassen für aktuelle Seite)">
    <button id="genQR">QR erzeugen</button>
    <div style="margin-top:10px;">
      <img id="qrImage" alt="QR-Code" src="" width="200" height="200">
    </div>
    <p style="font-size:.9rem;color:#333;margin-top:6px">Tipp: Lade diese Datei hoch, öffne die Seite, kopiere die URL in das Feld und klicke "QR erzeugen". Scan den angezeigten Code mit dem Smartphone.</p>
  </div>

  <div id="starsContainer"></div>

  <div class="marquee"><p>★ ★ ★ DU BIST HEUTE DER STAR! ★ ★ ★ HAPPY BIRTHDAY!!! ★ ★ ★</p></div>

<script>
/* ========== Stars ========== */
(function makeStars(){
  const container = document.getElementById('starsContainer');
  for(let i=0;i<7;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = (5 + Math.random()*90) + '%';
    s.style.top = (10 + Math.random()*65) + '%';
    s.style.transform = 'translateY(0) rotate('+ (Math.random()*40-20) +'deg)';
    s.style.animationDuration = (3 + Math.random()*3) + 's';
    s.style.opacity = 0.75 + Math.random()*0.25;
    container.appendChild(s);
  }
})();

/* ========== QR generation ========== */
document.getElementById('genQR').addEventListener('click', function(){
  let url = document.getElementById('urlInput').value.trim();
  if(!url) url = window.location.href;
  const enc = encodeURIComponent(url);
  const size = 300;
  const qrUrl = `https://chart.googleapis.com/chart?cht=qr&chs=${size}x${size}&chl=${enc}`;
  document.getElementById('qrImage').src = qrUrl;
});
document.getElementById('urlInput').value = '';

/* ========== Fullscreen ========== */
document.getElementById('fullBtn').addEventListener('click', async ()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){ console.warn('Fullscreen failed',e); }
});

/* ========== Fireworks (particle system) ========== */
const canvas = document.getElementById('fwCanvas');
const ctx = canvas.getContext('2d');
let W=canvas.width = innerWidth;
let H=canvas.height = innerHeight;
window.addEventListener('resize', ()=>{ W=canvas.width = innerWidth; H=canvas.height = innerHeight; });

let particles = [];
let rockets = [];
let anim = null;

/* *** WICHTIGE ÄNDERUNG: Auto-start und dauerhaft laufen lassen *** */
let running = true; // jetzt standardmäßig true — Feuerwerk läuft automatisch und dauerhaft

function rand(min,max){ return Math.random()*(max-min)+min; }

class Rocket {
  constructor(x,y,vx,vy,color){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.color=color; this.life=0;
  }
  step(){
    this.vy += 0.06;
    this.x += this.vx;
    this.y += this.vy;
    this.life++;
    if(this.vy>0 || this.life>80){
      createExplosion(this.x,this.y,this.color);
      return false;
    }
    return true;
  }
  draw(){
    ctx.beginPath();
    ctx.fillStyle=this.color;
    ctx.arc(this.x,this.y,3,0,Math.PI*2);
    ctx.fill();
  }
}

class Particle {
  constructor(x,y, vx,vy, color){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.color=color; this.alpha=1;
    this.size = rand(2,4);
  }
  step(){
    this.vx *= 0.99;
    this.vy += 0.03;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= 0.01;
    return this.alpha>0;
  }
  draw(){
    ctx.globalAlpha = Math.max(0,this.alpha);
    ctx.beginPath();
    ctx.fillStyle = this.color;
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function createExplosion(x,y){
  const count = 50 + Math.floor(Math.random()*60); // mehr Partikel
  const colors = ['#ff00aa','#ffdd00','#00e5ff','#7fff00','#ffffff','#ff6a00'];
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = Math.random()*4 + 1;
    const vx = Math.cos(ang)*spd;
    const vy = Math.sin(ang)*spd;
    const c = colors[Math.floor(Math.random()*colors.length)];
    particles.push(new Particle(x,y,vx,vy,c));
  }
}

function launchRandomRocket(){
  const x = rand(W*0.15, W*0.85);
  const y = H+10;
  const vx = rand(-1.2,1.2);
  const vy = -rand(6.5,9.0);
  rockets.push(new Rocket(x,y,vx,vy,'#fff'));
}

function frame(){
  // draw background with a tiny alpha for trailing effect
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0,0,W,H);

  rockets = rockets.filter(r => {
    const alive = r.step();
    r.draw();
    return alive;
  });
  particles = particles.filter(p => {
    const alive = p.step();
    p.draw();
    return alive;
  });

  // kontinuierliches Abschießen neuer Raketen (da running=true)
  if(running && Math.random() < 0.06) launchRandomRocket();

  anim = requestAnimationFrame(frame);
}

/* ========== Auto-start beim Laden ========== */
window.addEventListener('load', ()=>{
  // initiale Salve von Raketen
  for(let i=0;i<8;i++) setTimeout(()=>launchRandomRocket(), i*300);
  // starte die Animations-Loop, falls noch nicht aktiv
  if(!anim) frame();
  // Buttons zum Start/Stop ausblenden, weil das Feuerwerk permanent laufen soll
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  if(startBtn) startBtn.style.display = 'none';
  if(stopBtn) stopBtn.style.display = 'none';
});

/* Entferne Stop-Logik (Stop funktioniert nicht mehr) */
/* (Die alten Listener bleiben, aber die Buttons sind versteckt.) */

/* ========== Sound (manuell starten) ========== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new AudioCtx();
}
const notes = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99
};
const melody = [
  ['G4',0.25], ['G4',0.25], ['A4',0.5], ['G4',0.5], ['C5',0.5], ['B4',1.0],
  ['G4',0.25], ['G4',0.25], ['A4',0.5], ['G4',0.5], ['D5',0.5], ['C5',1.0]
];
function playCheesyMelody(){
  ensureAudio();
  const now = audioCtx.currentTime + 0.05;
  let t = now;
  melody.forEach(note=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = notes[note[0]] || 440;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.12, t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + note[1]*0.9 + 0.01);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + note[1] + 0.05);
    t += note[1] * 0.9;
  });
}
function partyBoop(){
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(200, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.12);
  g.gain.setValueAtTime(0.001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.6, audioCtx.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.28);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.3);
}
document.getElementById('playBtn').addEventListener('click', ()=>{
  try{ playCheesyMelody(); setTimeout(partyBoop, 600); }catch(e){ console.warn('Audio failed', e); }
});

/* kleine Interaktion: Klick auf Titel löst Extra-Raketen (und Sound wenn man möchte) */
document.getElementById('hb').addEventListener('click', ()=>{
  for(let i=0;i<8;i++){ setTimeout(()=>launchRandomRocket(), i*120); }
  // playCheesyMelody(); // deaktiviert, weil Sound manuell gestartet werden sollte
});

/* Keyboard shortcuts */
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space'){ e.preventDefault(); playCheesyMelody(); }
  if(e.key.toLowerCase()==='f'){ document.getElementById('fullBtn').click(); }
});
</script>
</body>
</html>
